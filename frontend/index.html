<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TriPlan</title>
  <!-- Connects the CSS file -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>TriPlan</h1>
    <p>Your AI-powered travel planner</p>
  </header>

  <main>
    <form id="trip-form">

      <label for="destination">Destination</label>
      <input type="text" id="destination" placeholder="e.g. Mangalore" required>

      <label for="start-date">Start date</label>
      <input type="date" id="start-date" required>

      <label for="end-date">End date</label>
      <input type="date" id="end-date" required>

      <label for="travellers">Number of travellers</label>
      <input type="number" id="travellers" min="1" value="1" required>

      <label for="budget">Budget (₹)</label>
      <input type="number" id="budget" min="0" placeholder="e.g. 20000" required>

      <fieldset>
        <legend>Travel interests</legend>
        <label><input type="checkbox" name="interests" value="Beaches"> Beaches</label>
        <label><input type="checkbox" name="interests" value="Temples"> Temples</label>
        <label><input type="checkbox" name="interests" value="Adventure"> Adventure</label>
        <label><input type="checkbox" name="interests" value="Nature"> Nature</label>
        <label><input type="checkbox" name="interests" value="Shopping"> Shopping</label>
      </fieldset>

      <fieldset>
        <legend>Food preference</legend>
        <label><input type="radio" name="food" value="Vegetarian" checked> Vegetarian</label>
        <label><input type="radio" name="food" value="Non-vegetarian"> Non-vegetarian</label>
        <label><input type="radio" name="food" value="No preference"> No preference</label>
      </fieldset>

      <button type="submit">Generate Trip</button>
    </form>

    <!-- JavaScript will put the message in here -->
    <section id="result"></section>
  </main>

  <!-- Connects the JavaScript file (at the end, so the page loads first) -->
  <script src="script.js"></script>
</body>
</html>
